# Two services now — and the second one is NOT a CodeRifts service.
#
# `db` is the executor's OWN state: it holds the articles, the consumed_grants ledger, and
# the state challenges. It is not an authorization oracle and is never consulted about
# whether a grant is valid — that stays offline against a pinned key. What Postgres buys
# is ATOMICITY: one transaction that CASes the state, consumes the grant, and mutates.
#
# There is still no CodeRifts container. Scene 5 remains true:
#   docker run --rm --network none <image> node /app/demo/offline-check.js
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: demo
      POSTGRES_USER: demo
      POSTGRES_DB: demo
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: demo/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      # demo is bootstrap (CREATE ROLE / migrate / TRUNCATE). host_role has
      # ZERO DML on articles; executor_role runs atomicExecute (STEP 1).
      DATABASE_URL: "postgres://demo:demo@db:5432/demo"
      HOST_DATABASE_URL: "postgres://cr_host:cr_host@db:5432/demo"
      EXECUTOR_DATABASE_URL: "postgres://cr_executor:cr_executor@db:5432/demo"
      DEPLOYMENT_ID: "demo-deployment"
    # The image generates its own DEMO keypair at build (so `docker run --network none` is
    # self-contained for scene 5). For the compose demo we mount the HOST keys instead, so the
    # host-side issuer (demo/issue-grant.js) and the in-container verifier share one keypair.
    # Without this the API would reject every host-issued grant with INVALID_SIGNATURE.
    volumes:
      - ./keys:/app/demo/keys:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 20
